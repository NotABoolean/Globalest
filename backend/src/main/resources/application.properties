# Carga .env si existe (local). Al ser 'optional:', si el archivo no existe (ej. en Docker o CI),
# no detiene el arranque y Spring buscará las variables directamente en las variables de entorno del sistema.
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisDialect Desactivada por ser una version demasiado antigua para poder correr en SpringBoot 4+
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true